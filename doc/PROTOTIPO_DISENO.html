<title>Nova · Propuesta de diseño</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Concepto: "noche de estudio". Un tablero de propuesta con tres columnas
   (pantallas · dispositivo vivo · detalles). La brasa (acento) solo marca lo activo y lo que se toca. */
:root{
  --bg:#F3EDE4; --panel:#FFFBF6; --panel2:#F0E7DB; --line:#DFD1C1; --fg:#211A15; --dim:#665648;
  --accent:#AE461B; --accent-fill:#B9501F; --on-accent:#FFFFFF; --accent-soft:rgba(185,80,31,.12);
  --ok:#2E7452; --ok-soft:rgba(46,116,82,.12); --warn:#8A5E06; --warn-soft:rgba(176,124,20,.14);
  --bad:#AE3229; --bad-soft:rgba(174,50,41,.11); --glass:rgba(255,251,246,.74); --shadow:0 18px 50px rgba(60,35,15,.13);
  --track:#E6DACB; --halo:rgba(185,80,31,.45);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14110F; --panel:#1F1A17; --panel2:#29221D; --line:#3D322B; --fg:#F3EADD; --dim:#B5A698;
  --accent:#F2946A; --accent-fill:#E2703F; --on-accent:#1B120C; --accent-soft:rgba(226,112,63,.16);
  --ok:#8CC7A9; --ok-soft:rgba(134,191,162,.14); --warn:#E8C76F; --warn-soft:rgba(230,195,106,.13);
  --bad:#EE9A93; --bad-soft:rgba(229,140,140,.13); --glass:rgba(31,26,23,.72); --shadow:0 24px 70px rgba(0,0,0,.5);
  --track:#352C26; --halo:rgba(226,112,63,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110F; --panel:#1F1A17; --panel2:#29221D; --line:#3D322B; --fg:#F3EADD; --dim:#B5A698;
  --accent:#F2946A; --accent-fill:#E2703F; --on-accent:#1B120C; --accent-soft:rgba(226,112,63,.16);
  --ok:#8CC7A9; --ok-soft:rgba(134,191,162,.14); --warn:#E8C76F; --warn-soft:rgba(230,195,106,.13);
  --bad:#EE9A93; --bad-soft:rgba(229,140,140,.13); --glass:rgba(31,26,23,.72); --shadow:0 24px 70px rgba(0,0,0,.5);
  --track:#352C26; --halo:rgba(226,112,63,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- marco de la propuesta ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:20px;font-weight:800}
.brand small{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.star{width:12px;height:12px;border-radius:50%;background:var(--accent-fill);box-shadow:0 0 0 0 var(--halo);animation:halo 2.6s ease-out infinite;flex:none}
@keyframes halo{0%{box-shadow:0 0 0 0 var(--halo)}100%{box-shadow:0 0 0 16px rgba(0,0,0,0)}}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;position:relative}
.seg button{border:0;background:none;border-radius:9px;padding:6px 11px;font-size:13.5px;color:var(--dim);display:inline-flex;align-items:center;gap:6px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 0 var(--line),0 2px 8px rgba(0,0,0,.08);font-weight:600}
.layout{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;padding-top:20px;align-items:start}
.layout .notes{grid-column:2;position:static;max-width:1120px;width:100%;justify-self:center}
.layout .notes ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 22px}
@media (min-width:1720px){.layout{max-width:1700px;grid-template-columns:190px minmax(0,1fr) 300px}.layout .notes{grid-column:3;position:sticky}.layout .notes ul{display:flex}}
@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}.layout .notes{grid-column:1}.screens{position:static!important}}
.screens{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:4px}
@media (max-width:1180px){.screens{flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}}
.screens .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 10px 6px}
@media (max-width:1180px){.screens .lbl{display:none}}
.scr{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;border-radius:12px;padding:9px 10px;text-align:left;color:var(--dim);font-size:14.5px;white-space:nowrap;min-height:42px}
.scr:hover{color:var(--fg);background:var(--panel2)}
.scr[aria-current="true"]{background:var(--panel);border-color:var(--line);color:var(--fg);font-weight:600}
.scr .n{font-family:var(--mono);font-size:11px;color:var(--dim)}
.stage{min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage-cap{align-self:stretch;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
@media (max-width:1180px){.notes{position:static}}
.notes h2{font-size:19px}
.notes .from{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.notes ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.notes li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:14px;color:var(--fg)}
.notes li svg{margin-top:3px;color:var(--accent)}
.notes .foot{font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}

/* ---------- dispositivos ---------- */
.pc{width:100%;max-width:1120px;height:760px;background:var(--bg);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;position:relative}
.pc-bar{position:absolute;inset:0 0 auto;height:34px;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel2);z-index:3}
.pc-bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pc-bar span{margin-left:10px;font-family:var(--mono);font-size:11.5px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pc-body{display:flex;width:100%;padding-top:34px;min-height:0}
.phone{width:390px;max-width:100%;height:800px;border-radius:46px;border:10px solid var(--panel2);outline:1px solid var(--line);background:var(--bg);box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
.content{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.content-in{padding:26px 30px 40px;display:flex;flex-direction:column;gap:18px;max-width:980px;margin:0 auto}
.phone .content-in{padding:20px 16px 130px}

/* barra lateral curva */
.side{width:236px;flex:none;padding:14px 0 14px 14px;display:flex}
.side-in{flex:1;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px 26px 26px 26px;padding:16px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.prof{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--accent-soft);color:var(--accent);position:relative;flex:none}
.ava::after{content:"";position:absolute;right:0;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.prof b{font-size:14.5px;display:flex;gap:6px;align-items:center}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 7px;font-weight:600}
.prof small{font-size:12px;color:var(--dim)}
.mlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;padding:8px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;width:100%;text-align:left;padding:8px 10px;border-radius:12px;color:var(--dim);font-size:14px;position:relative;min-height:38px;transition:background .2s,color .2s}
.nav:hover{background:var(--panel2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav .chev{margin-left:auto;transition:transform .25s}
.nav .chev.open{transform:rotate(90deg)}
.sub{display:flex;flex-direction:column;margin:2px 0 4px 21px;border-left:1.5px solid var(--line);padding-left:10px}
.sub button{border:0;background:none;text-align:left;font-size:13.5px;color:var(--dim);padding:6px 8px;border-radius:9px;position:relative;min-height:32px}
.sub button[aria-current="page"]{color:var(--fg);font-weight:600}
.sub button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:50%;width:9px;height:1.5px;background:var(--accent)}
.badge-n{margin-left:auto;font-family:var(--mono);font-size:11px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:var(--panel);display:grid;place-items:center;padding:0 5px;font-weight:600}
.notice{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.notice::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%)}
.notice small{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.notice b{font-family:var(--display);font-size:16px}
.notice p{font-size:12.5px;color:var(--dim)}
.side-foot{display:flex;flex-direction:column;gap:2px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}

/* barra inferior flotante */
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:66px;border-radius:24px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:var(--shadow);z-index:5}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--dim);position:relative;z-index:1;height:100%;justify-content:center;min-width:44px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab .dot{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:var(--panel);font-size:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:600}
.tab-ind{position:absolute;top:8px;bottom:8px;width:calc((100% - 0px)/5 - 12px);margin-left:6px;border-radius:16px;background:var(--accent-soft);transition:transform .35s cubic-bezier(.3,1.3,.5,1);z-index:0}
.tab-mid{border:0;width:58px;height:58px;border-radius:50%;background:var(--accent-fill);color:var(--on-accent);display:grid;place-items:center;margin:-34px auto 0;box-shadow:0 0 0 6px var(--bg),0 0 0 0 var(--halo);animation:halo-mid 2.4s ease-out infinite;position:relative;z-index:2}
@keyframes halo-mid{0%{box-shadow:0 0 0 6px var(--bg),0 0 0 6px var(--halo)}100%{box-shadow:0 0 0 6px var(--bg),0 0 0 22px rgba(0,0,0,0)}}

/* menú de cristal (Más) */
.glassmenu{position:absolute;inset:10px;border-radius:34px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);z-index:9;padding:30px 26px 22px;display:flex;flex-direction:column;animation:rise .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}}
.glassmenu nav{display:flex;flex-direction:column;gap:2px;margin-top:18px}
.gm-item{border:0;background:none;text-align:left;font-family:var(--display);font-size:34px;font-weight:700;color:var(--dim);display:flex;align-items:center;gap:12px;padding:4px 0;letter-spacing:-.02em;transition:color .2s,transform .25s;min-height:52px}
.gm-item:hover{color:var(--fg);transform:translateX(4px)}
.gm-item[aria-current="page"]{color:var(--fg)}
.gm-item[aria-current="page"]::before{content:"";width:18px;height:2px;background:var(--accent)}
.gm-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--dim)}

/* ---------- piezas comunes ---------- */
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.h-screen{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.h-screen h2{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.02}
.h-screen h2 em{font-style:normal;color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.card h3{font-size:17px;font-weight:700}
.card .sub-t{font-size:13px;color:var(--dim)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .g4,.phone .g3,.phone .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .g2.stack,.phone .g3.stack{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--accent-fill);color:var(--on-accent);transition:transform .15s,filter .2s,background .3s;position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.ok{background:var(--ok);color:var(--panel)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:10px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--dim)}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.chip.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip.acc{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--dim)}
.input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:max(16px,15px);color:var(--fg);min-height:44px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start;animation:rise .3s ease both}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg svg{flex:none;margin-top:2px}
.bar{height:8px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent-fill);transition:width .7s cubic-bezier(.3,1.2,.5,1)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.example{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}

/* tarjetas de datos */
.stat{gap:6px}
.stat .k{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
.stat .k svg{color:var(--accent)}
.stat .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em}
.stat .d{font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trend-up{color:var(--ok);font-weight:600}
.trend-down{color:var(--bad);font-weight:600}
.spark{width:100%;height:34px;display:block}
.lift{transition:transform .25s,box-shadow .25s}
.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow)}

/* semana */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid transparent;background:none;border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--dim);min-height:60px}
.day b{font-family:var(--display);font-size:19px;color:var(--fg)}
.day[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent)}
.day[aria-pressed="true"] b{color:var(--on-accent)}
.day .pips{display:flex;gap:3px;height:6px}
.day .pips i{width:5px;height:5px;border-radius:50%}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:14px;border:0;background:var(--panel2);text-align:left;width:100%;transition:background .2s}
.task:hover{background:var(--accent-soft)}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--c);flex:none;display:grid;place-items:center;transition:background .25s;margin-top:1px}
.task.done .box{background:var(--c)}
.box svg{color:var(--panel);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.task.done .box svg{transform:scale(1)}
.task .t{font-size:14.5px;font-weight:500;display:block}
.task.done .t{text-decoration:line-through;color:var(--dim)}
.task .m{font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .arc{transition:stroke-dashoffset .8s cubic-bezier(.3,1.3,.5,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800}

/* asistente */
.chatbox{display:flex;flex-direction:column;gap:10px;min-height:280px}
.q,.a{max-width:86%;padding:10px 14px;font-size:14.5px;line-height:1.45;animation:rise .3s ease both}
.q{align-self:flex-end;background:var(--accent-fill);color:var(--on-accent);border-radius:18px 18px 6px 18px;font-weight:500}
.a{align-self:flex-start;background:var(--panel2);border-radius:18px 18px 18px 6px}
.a .tag{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.a.ia{border:1px dashed var(--accent)}
.cite{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:999px;padding:3px 10px;min-height:28px}
.cite:hover{border-color:var(--accent)}
.frag{margin-top:8px;font-size:13.5px;color:var(--dim);border-left:2px solid var(--accent);padding:2px 0 2px 10px;font-style:italic;animation:rise .25s ease both}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:bob 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}
.sugs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sugs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--dim);min-height:36px}
.sugs button:hover{border-color:var(--accent);color:var(--fg)}
.scope{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scope button{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim);display:inline-flex;gap:6px;align-items:center;min-height:36px}
.scope button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ask{display:flex;gap:8px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent-fill);color:var(--on-accent);display:grid;place-items:center;flex:none}

/* fuentes */
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--bg)}
.files{display:flex;flex-wrap:wrap;gap:8px}
.files button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;font-size:13.5px;min-height:44px}
.files button:hover:not(:disabled){border-color:var(--accent)}
.files small{font-family:var(--mono);font-size:11px;color:var(--dim)}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stages li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:14px;color:var(--dim);transition:color .3s}
.stages .st{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:all .3s}
.stages li.now{color:var(--fg)}
.stages li.now .st{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stages li.now .st::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-fill);animation:bob 1s infinite}
.stages li.done{color:var(--fg)}
.stages li.done .st{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.doc{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.docicon{width:36px;height:46px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font-family:var(--mono);font-size:9.5px;font-weight:600;position:relative}
.docicon::after{content:"";position:absolute;right:-1px;top:-1px;width:10px;height:10px;background:var(--bg);border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-left-radius:4px}
.doc b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc small{font-size:12px;color:var(--dim)}

/* semestre */
.subjects{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.subjects button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:13.5px;display:inline-flex;gap:8px;align-items:center;color:var(--dim);min-height:38px}
.subjects button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.big{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.03em}
.cortes{display:flex;gap:4px;height:14px}
.cortes div{border-radius:6px;background:var(--track);position:relative;overflow:hidden}
.cortes div i{position:absolute;inset:0 auto 0 0;background:var(--accent-fill);opacity:.55;transition:width .5s}
.cortes div.left i{opacity:1;background:repeating-linear-gradient(135deg,var(--accent-fill) 0 6px,transparent 6px 10px)}
.fdots{display:flex;gap:6px;flex-wrap:wrap}
.fdots i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);transition:background .25s,transform .25s}
.fdots i.on{background:var(--bad);border-color:var(--bad);transform:scale(1.06)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1}
.stepper button:hover{border-color:var(--accent)}
.stepper output{min-width:46px;text-align:center;font-family:var(--display);font-weight:800;font-size:20px}
.topic{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--panel2);flex-wrap:wrap}
.topic.prop{background:none;border:1px dashed var(--accent)}
.topic span{flex:1;min-width:140px;font-size:14px}
.topic small{font-family:var(--mono);font-size:11px;color:var(--dim)}
.underline-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);position:relative}
.underline-tabs button{border:0;background:none;padding:8px 0 10px;font-size:14.5px;color:var(--dim);min-height:40px}
.underline-tabs button[aria-pressed="true"]{color:var(--fg);font-weight:600}
.ut-ind{position:absolute;bottom:-1px;height:2px;background:var(--accent-fill);transition:left .35s cubic-bezier(.3,1.2,.5,1),width .35s}

/* clave de Gemini */
.steps-n{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps-n li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;counter-increment:s}
.steps-n li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.otp{display:flex;gap:8px}
.otp span{width:44px;height:54px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:20px;font-weight:600;background:var(--bg);transition:border-color .3s}
.otp span.in{border-color:var(--ok);animation:flip .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}}
.checkdraw{width:54px;height:54px}
.checkdraw circle{stroke-dasharray:151;stroke-dashoffset:151;animation:draw .6s ease forwards}
.checkdraw path{stroke-dasharray:36;stroke-dashoffset:36;animation:draw .4s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* administración */
.gauge{display:flex;gap:16px;align-items:center}
.gauge svg{flex:none}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 12px;background:var(--panel2);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.blocked td{background:var(--bad-soft)}
td .mail{font-weight:600;display:block}
td small{color:var(--dim)}
.mini{width:70px;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.mini i{display:block;height:100%;background:var(--accent-fill)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.log li:first-child{border-top:0}
.log time{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.livedot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 0 var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok-soft)}100%{box-shadow:0 0 0 10px rgba(0,0,0,0)}}

/* entrada con lámpara */
.scene{position:relative;border-radius:24px;overflow:hidden;min-height:620px;background:#120E0C;color:#F3EADD;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:20px;padding:36px}
.phone .scene{grid-template-columns:minmax(0,1fr);min-height:700px;padding:28px 18px;align-content:start}
@media (max-width:760px){.scene{grid-template-columns:minmax(0,1fr)}}
.scene .glow{position:absolute;left:4%;top:120px;width:520px;height:620px;max-width:100%;background:radial-gradient(ellipse at 40% 0%,rgba(255,196,120,.42),rgba(255,160,90,.12) 45%,transparent 70%);clip-path:polygon(32% 0,58% 0,100% 100%,0 100%);opacity:0;transition:opacity .9s ease;pointer-events:none}
.scene.on .glow{opacity:1}
.lamp{position:relative;height:440px;display:flex;justify-content:center}
.phone .lamp{height:300px}
.shade{position:absolute;top:60px;width:150px;height:84px;background:linear-gradient(#3A2E26,#241C17);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);transition:background .6s}
.scene.on .shade{background:linear-gradient(#5B4434,#3A2B20)}
.bulb{position:absolute;top:132px;width:40px;height:16px;border-radius:0 0 20px 20px;background:#3B322B;transition:background .5s,box-shadow .5s}
.scene.on .bulb{background:#FFE2B0;box-shadow:0 0 30px 12px rgba(255,200,120,.55)}
.pole{position:absolute;top:144px;bottom:28px;width:5px;background:#3A2E26;border-radius:3px}
.base{position:absolute;bottom:18px;width:120px;height:14px;border-radius:8px;background:#2E2520}
.cord{position:absolute;top:144px;left:calc(50% + 34px);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;min-width:44px;min-height:120px;color:#F3EADD}
.cord i{width:1.5px;height:80px;background:#8C7B6B;transition:height .25s}
.cord:active i{height:96px}
.cord b{width:14px;height:14px;border-radius:50%;background:#E2703F;box-shadow:0 0 0 0 rgba(226,112,63,.6);animation:halo 2.2s infinite}
.cord span{margin-top:8px;font-size:12px;color:#B5A698;font-family:var(--mono)}
.login{position:relative;z-index:1;background:rgba(31,26,23,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #3D322B;border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px;max-width:400px;width:100%;justify-self:center;opacity:.25;transform:translateY(16px);transition:opacity .7s .2s,transform .7s .2s,box-shadow .7s}
.scene.on .login{opacity:1;transform:none;box-shadow:0 0 80px rgba(255,170,100,.18)}
.login h3{font-size:28px;font-weight:800;color:#F3EADD}
.login p{color:#C9BBAE;font-size:14px}
.gbtn{border:1px solid #4A3D34;background:#F3EADD;color:#1B120C;border-radius:12px;min-height:48px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.gbtn:disabled{opacity:.55;cursor:default}
.login small{color:#B5A698;font-size:12.5px}
.login .lmsg{color:#8CC7A9;font-size:13.5px}

/* ---------- plan anterior: la misma identidad, sin los recursos del video ---------- */
.flat .side{padding:0}
.flat .side-in{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none;border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none}
.flat .tabbar{left:0;right:0;bottom:0;height:70px;border-radius:0;border-width:1px 0 0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--panel)}
.flat .tab-ind{display:none}
.flat .phone .content-in{padding-bottom:110px}
.flat .lift:hover{transform:none;box-shadow:none}
.flat .spark{display:none}
.flat .card{border-radius:16px}
.logo{font-family:var(--display);font-weight:800;font-size:24px;color:var(--accent);padding:6px 10px 16px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px 24px;display:flex;flex-direction:column;gap:2px;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:rise .25s ease both}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;margin-bottom:10px}
.sheet button.row-i{border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;font-size:15px;text-align:left;min-height:48px}
.sheet button.row-i:hover{background:var(--panel2)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:8;border:0}
.plain-login{max-width:420px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px}
.plain-login h3{font-size:26px;font-weight:800}

.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- utilidades de animación ---------- */
function useCount(target, dur = 900) {
  const [v, setV] = useState(target);
  useLayoutEffect(() => {
    if (reduceMotion()) { setV(target); return; }
    let raf = 0, t0 = 0;
    setV(0);
    const step = (t) => {
      if (!t0) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      setV(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}

  return <span className="num">{dec ? f1(v) : Math.round(v).toLocaleString('es-CO')}</span>;
}
function Spark({ data, color = 'var(--accent)' }) {
  const W = 160, H = 34, max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((d, i) => [4 + (i * (W - 8)) / (data.length - 1), 4 + (H - 8) * (1 - (d - min) / (max - min || 1))]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return (
    <svg className="spark" viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="none" aria-hidden="true">
      <path d={line + ' L' + last[0] + ' ' + H + ' L4 ' + H + 'Z'} fill={color} opacity="0.12" />
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
      <circle cx={last[0]} cy={last[1]} r="3" fill={color} />
    </svg>
  );
}
function Ring({ done, total, size = 120, label }) {
  const r = size / 2 - 9, c = 2 * Math.PI * r;
  return (
    <div className="ring" style={{ width: size, height: size }} role="img" aria-label={label}>
      <svg width={size} height={size}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--track)" strokeWidth="11" />
        <circle className="arc" cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--accent-fill)" strokeWidth="11" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - (total ? done / total : 0))} />
      </svg>
      <span style={{ fontSize: size / 4.2 }} className="num">{done}/{total}</span>
    </div>
  );
}
/* botón con estados, inspirado en el checkout animado */
function StateButton({ idle, busy, done, icon = 'spark', className = '' }) {
  const [st, setSt] = useState('idle');
  const flat = useFlat();
  const go = () => {
    if (st !== 'idle') return;
    setSt('busy');
    if (flat) { setTimeout(() => setSt('idle'), reduceMotion() ? 300 : 1400); return; }
    setTimeout(() => setSt('done'), reduceMotion() ? 300 : 1400);
    setTimeout(() => setSt('idle'), reduceMotion() ? 1500 : 3200);
  };
  return (
    <button type="button" className={'btn ' + (st === 'done' ? 'ok ' : '') + className} onClick={go} aria-live="polite">
      {st === 'idle' && <><Icon n={icon} s={17} />{idle}</>}
      {st === 'busy' && <><span className="spin" aria-hidden="true" />{busy}</>}
      {st === 'done' && <><Icon n="check" s={17} w={2.4} />{done}</>}
    </button>
  );
}

const SUGS = Object.keys(ANSWERS);
function Asistente() {
  const [scope, setScope] = useState(0);
  const [msgs, setMsgs] = useState([
    { id: 1, who: 'q', text: '¿Qué es la regla de la cadena?' },
    { id: 2, who: 'a', text: 'Sirve para derivar una función compuesta: derivas la función de afuera, evaluada en la de adentro, y multiplicas por la derivada de la de adentro.', cite: 'Cálculo de una variable · cap. 3 · p. 88', frag: '«Si y = f(g(x)), entonces y′ = f′(g(x)) · g′(x). Esta regla se llama regla de la cadena…»' },
  ]);
  const [open, setOpen] = useState({});
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const box = useRef(null);
  const nid = useRef(3);
  useEffect(() => { const b = box.current && box.current.closest('.content'); if (b) b.scrollTop = b.scrollHeight; }, [msgs]);
  const ask = (q) => {
    const text = q.trim();
    if (!text || busy) return;
    const ia = scope === 4;
    const base = ANSWERS[text];
    const r = ia ? { t: 'La regla de la cadena la formalizó Leibniz en el siglo XVII. Respondo con conocimiento general, no con tus documentos.', tag: 'IA general · no viene de tus documentos', ia: true }
      : base || { none: true };
    const qid = nid.current++, aid = nid.current++;
    setBusy(true);
    setMsgs((m) => m.concat([{ id: qid, who: 'q', text }, { id: aid, who: 'a', typing: true, text: '' }]));
    const patch = (p) => setMsgs((m) => m.map((x) => (x.id === aid ? { ...x, ...p } : x)));
    if (r.none) {
      setTimeout(() => { patch({ typing: false, none: true, text: 'No encontré esto en tus documentos.' }); setBusy(false); }, reduceMotion() ? 0 : 700);
      return;
    }
    const words = r.t.split(' ');
    let i = 0;
    const tick = () => {
      if (i < words.length) { i++; patch({ typing: false, text: words.slice(0, i).join(' '), tag: r.tag, ia: r.ia }); setTimeout(tick, reduceMotion() ? 0 : 45); }
      else { patch({ cite: r.cite, frag: r.frag }); setBusy(false); }
    };
    setTimeout(tick, reduceMotion() ? 0 : 750);
  };
  return (
    <>
      <div className="h-screen">
        <div><p className="eyebrow">Asistente</p><h2>Pregunta a tus <em>fuentes</em>.</h2></div>

            <div key={m.id} className={'a' + (m.ia ? ' ia' : '')}>
              {m.tag && <span className="tag">{m.tag}</span>}
              {m.typing ? <span className="typing" aria-label="Nova está escribiendo"><i /><i /><i /></span> : m.text}
              {m.none && <div style={{ marginTop: 8 }}><button type="button" className="btn sm" onClick={() => { setScope(4); }}><Icon n="spark" s={15} />Preguntarle a la IA</button></div>}
              {m.cite && <div><button type="button" className="cite" aria-expanded={!!open[m.id]} onClick={() => setOpen({ ...open, [m.id]: !open[m.id] })}><Icon n="book" s={13} />{m.cite}<Icon n="chev" s={12} /></button></div>}
              {m.cite && open[m.id] && <p className="frag">{m.frag}</p>}
            </div>
          ))}
        </div>
        <div className="sugs" aria-label="Preguntas sugeridas">
          {SUGS.map((s) => <button type="button" key={s} onClick={() => ask(s)} disabled={busy}>{s}</button>)}
        </div>

        </form>

        {[80, 95].map((m) => { const ang = (m / 100) * 2 * Math.PI - Math.PI / 2; return <line key={m} x1={48 + 32 * Math.cos(ang)} y1={48 + 32 * Math.sin(ang)} x2={48 + 44 * Math.cos(ang)} y2={48 + 44 * Math.sin(ang)} stroke="var(--dim)" strokeWidth="1.5" />; })}

function Bars({ data }) {
  const W = 560, H = 190, padL = 28, padB = 26, max = Math.max(...data, 4);

    </svg>
  );
}

    </>
  );
}

function TabBar({ screen, go, openMore }) {

  return (

          ) : (
            <div className="pc">
              <div className="pc-bar" aria-hidden="true"><i /><i /><i /><span>nova-assistantsm-kappa.vercel.app/nova{screen === 'inicio' ? '' : '/' + screen}</span></div>
              <div className="pc-body">
                {screen !== 'entrada' && <Sidebar screen={screen} go={go} />}
                {body}
              </div>
            </div>
          )}
        </main>
        {plan === 'anterior' ? (
          <aside className="notes" aria-labelledby="t-notas">
            <span className="from">Plan anterior · solo tu presentación</span>
            <h2 id="t-notas">La Nova de hoy, con otra piel</h2>
            <ul>{NOTES_ANT[screen].map((x) => <li key={x}><Icon n="file" s={15} /><span>{x}</span></li>)}</ul>
            <p className="foot">Misma paleta, mismas letras y mismos detalles de tu presentación, sobre la estructura actual de Nova: barra lateral fija, barra inferior pegada al borde y hoja “Más” sencilla. Cambia a “Con el video” para comparar.</p>
          </aside>
        ) : (
          <aside className="notes" aria-labelledby="t-notas">
            <span className="from">{note.from}</span>
            <h2 id="t-notas">{note.title}</h2>
            <ul>{note.items.map((x) => <li key={x}><Icon n="spark" s={15} /><span>{x}</span></li>)}</ul>
            <p className="foot">Ideas tomadas del video de componentes y de tu presentación, adaptadas a Nova. Funciona en claro y oscuro, con teclado y con “reducir movimiento”.</p>
          </aside>
        )}
      </div>
    </PlanCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
